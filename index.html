<!DOCTYPE html>
<html>
<head>
<title>e-Kehadiran SMK Kampung Baru Kerteh</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-header">

    <h1>
        📚 e-Kehadiran
    </h1>

    <p>
        SMK KAMPUNG BARU KERTEH
    </p>

    <span id="tarikhHariIni"></span>

</div> 

<div class="container">




<div class="result">

<div class="form-card">

    <div class="field">

        <label>🏫 Pilih Kelas</label>

        <select id="kelas" onchange="tukarKelas()">

<option value="1 Mawar">1 Mawar</option>
<option value="1 Melati">1 Melati</option>
<option value="1 Melur">1 Melur</option>

<option value="2 Mawar">2 Mawar</option>
<option value="2 Melati">2 Melati</option>
<option value="2 Melur">2 Melur</option>

<option value="3 Mawar">3 Mawar</option>
<option value="3 Melati">3 Melati</option>
<option value="3 Melur">3 Melur</option>

<option value="4 Bakawali">4 Bakawali</option>
<option value="4 Cempaka">4 Cempaka</option>
<option value="4 Kenanga">4 Kenanga</option>
<option value="4 Seroja">4 Seroja</option>

<option value="5 Bakawali">5 Bakawali</option>
<option value="5 Cempaka">5 Cempaka</option>
<option value="5 Kenanga">5 Kenanga</option>
<option value="5 Seroja">5 Seroja</option>



        </select>

    </div>


    <div class="murid-card">

        👥 Jumlah Murid

        <h2 id="jumlahLabel">34 Orang</h2>

        <input
        id="jumlah"
        value="34"
        readonly
        hidden>

    </div>


    <div class="field">

        <label>✍️ Masukkan Kehadiran Hari Ini
 	</label>

        <input
        type="number"
        id="hadir"
        placeholder="Masukkan jumlah hadir"
        min="0"
        max="34"
        oninput="kira()">

    </div>



    <div class="summary">

        <div class="summary-card">

    <small>👥 Hadir</small>

    <h2 id="hadirView">0</h2>

</div>


        <div class="summary-card">

            <small>❌ Tidak Hadir</small>

            <h2 id="takHadir">0</h2>

        </div>


        <div class="summary-card">

            <small>📈 Kehadiran</small>

            <h2><span id="peratus">0</span>%</h2>

        </div>

    </div>



    <button id="btnSimpan" onclick="simpan()">

        💾 SIMPAN KEHADIRAN

    </button>

    <p id="status"></p>

</div>

<hr>

<h2 style="text-align:center">
REKOD KEHADIRAN HARI INI
</h2>


<div class="table-container">

<table id="rekod">

</table>

</div>


</div>



<script src="js/script.js"></script>


</body>

</html>
